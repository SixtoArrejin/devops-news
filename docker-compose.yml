services:
  # Redis para caché y almacenamiento
  redis:
    image: redis:7-alpine
    container_name: devops-news-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - devops-news-network

  # API Backend
  api:
    build: 
      context: ./devops-news-api
      dockerfile: Dockerfile
    container_name: devops-news-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_USERNAME=${REDIS_USERNAME:-default}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - NEWS_API_URL=https://newsapi.org/v2
      - CACHE_TTL=7200
      - NEWS_REFRESH_INTERVAL=2
    depends_on:
      - redis
    networks:
      - devops-news-network
    volumes:
      - ./devops-news-api/.env:/app/.env:ro

  # Frontend
  frontend:
    build: 
      context: ./devops-news-app
      dockerfile: Dockerfile
    container_name: devops-news-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_NODE_ENV=production
    depends_on:
      - api
    networks:
      - devops-news-network

volumes:
  redis_data:
    driver: local

networks:
  devops-news-network:
    driver: bridge